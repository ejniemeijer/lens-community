<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="390" height="844" fill="#F1F5F9"/>

  <!-- status bar -->
  <text x="26" y="34" font-size="13" font-weight="700" fill="#0F172A">9:41</text>
  <g fill="#0F172A"><rect x="316" y="24" width="18" height="11" rx="2"/><rect x="340" y="22" width="24" height="13" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/><rect x="342" y="24" width="17" height="9" rx="1.5"/></g>

  <!-- nav -->
  <text x="26" y="76" font-size="22" fill="#0F172A">‹</text>
  <text x="195" y="74" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Your quote</text>

  <!-- garage header -->
  <rect x="22" y="96" width="346" height="96" rx="18" fill="#FFFFFF"/>
  <rect x="38" y="112" width="64" height="64" rx="14" fill="#1E293B"/>
  <text x="70" y="152" font-size="26" text-anchor="middle">🔧</text>
  <text x="118" y="132" font-size="16" font-weight="700" fill="#0F172A">PitStop Central</text>
  <text x="118" y="153" font-size="12" fill="#64748B">Kruisweg 22 · 1.2 km away</text>
  <text x="118" y="174" font-size="12" fill="#F59E0B">★★★★★ <tspan fill="#64748B">4.8 (312)</tspan></text>

  <!-- service summary -->
  <text x="26" y="228" font-size="13" font-weight="700" fill="#0F172A">Service</text>
  <rect x="22" y="242" width="346" height="70" rx="16" fill="#FFFFFF"/>
  <circle cx="58" cy="277" r="18" fill="#FEE2E2"/><text x="58" y="283" font-size="16" text-anchor="middle">🛑</text>
  <text x="88" y="272" font-size="15" font-weight="700" fill="#0F172A">Front brake pads &amp; discs</text>
  <text x="88" y="293" font-size="12" fill="#64748B">Est. 2 hrs · Volvo XC60</text>

  <!-- itemized quote -->
  <text x="26" y="348" font-size="13" font-weight="700" fill="#0F172A">Estimate</text>
  <rect x="22" y="362" width="346" height="182" rx="16" fill="#FFFFFF"/>
  <g font-size="14" fill="#334155">
    <text x="42" y="396">Brake pads (front)</text><text x="348" y="396" text-anchor="end" font-weight="600" fill="#0F172A">€ 89.00</text>
    <text x="42" y="428">Brake discs (pair)</text><text x="348" y="428" text-anchor="end" font-weight="600" fill="#0F172A">€ 164.00</text>
    <text x="42" y="460">Labour (2 hrs)</text><text x="348" y="460" text-anchor="end" font-weight="600" fill="#0F172A">€ 130.00</text>
    <text x="42" y="492" fill="#64748B" font-size="13">Fluids &amp; sundries</text><text x="348" y="492" text-anchor="end" font-weight="600" fill="#0F172A">€ 18.00</text>
  </g>
  <line x1="42" y1="510" x2="348" y2="510" stroke="#E2E8F0"/>
  <text x="42" y="534" font-size="15" font-weight="700" fill="#0F172A">Total (incl. VAT)</text>
  <text x="348" y="534" font-size="18" font-weight="800" fill="#0F172A" text-anchor="end">€ 401.00</text>

  <!-- when -->
  <text x="26" y="582" font-size="13" font-weight="700" fill="#0F172A">Earliest slot</text>
  <rect x="22" y="596" width="346" height="64" rx="16" fill="#EEF2FF"/>
  <text x="42" y="624" font-size="14" font-weight="700" fill="#3730A3">Tomorrow · 08:30</text>
  <text x="42" y="644" font-size="12" fill="#6366F1">Free courtesy car available</text>
  <text x="348" y="634" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="end">Change ›</text>

  <!-- sticky CTA -->
  <rect x="0" y="748" width="390" height="96" fill="#FFFFFF"/>
  <line x1="0" y1="748" x2="390" y2="748" stroke="#E2E8F0"/>
  <rect x="22" y="768" width="346" height="58" rx="16" fill="#F59E0B"/>
  <text x="195" y="804" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">Confirm booking · € 401</text>
</svg>
