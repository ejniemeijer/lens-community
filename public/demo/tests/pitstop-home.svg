<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="carCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- screen -->
  <rect width="390" height="844" fill="#F1F5F9"/>

  <!-- status bar -->
  <text x="26" y="34" font-size="13" font-weight="700" fill="#0F172A">9:41</text>
  <g fill="#0F172A"><rect x="316" y="24" width="18" height="11" rx="2"/><rect x="340" y="22" width="24" height="13" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/><rect x="342" y="24" width="17" height="9" rx="1.5"/></g>

  <!-- header -->
  <text x="26" y="78" font-size="14" fill="#64748B">Good morning,</text>
  <text x="26" y="102" font-size="24" font-weight="800" fill="#0F172A">Sam</text>
  <circle cx="350" cy="86" r="20" fill="#FDE68A"/>
  <text x="350" y="92" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">SD</text>

  <!-- car status card -->
  <rect x="22" y="128" width="346" height="150" rx="20" fill="url(#carCard)"/>
  <text x="42" y="162" font-size="12" fill="#94A3B8">MY CAR</text>
  <text x="42" y="188" font-size="19" font-weight="700" fill="#FFFFFF">Volvo XC60</text>
  <text x="42" y="208" font-size="13" fill="#CBD5E1">AB-123-CD · 84,200 km</text>
  <!-- simple car silhouette -->
  <g transform="translate(250,150)" fill="#F59E0B">
    <path d="M6 44 q4 -22 26 -24 l14 -14 q4 -4 12 -4 l24 0 q10 0 18 12 l10 14 q14 2 16 20 l0 6 q0 4 -6 4 l-8 0 a12 12 0 0 0 -24 0 l-44 0 a12 12 0 0 0 -24 0 l-8 0 q-6 0 -6 -4 z"/>
  </g>
  <circle cx="278" cy="240" r="9" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="330" cy="240" r="9" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
  <!-- health -->
  <text x="42" y="240" font-size="11" fill="#94A3B8">Next service in</text>
  <text x="42" y="258" font-size="15" font-weight="700" fill="#34D399">2,400 km</text>

  <!-- primary CTA -->
  <rect x="22" y="298" width="346" height="60" rx="16" fill="#F59E0B"/>
  <text x="195" y="335" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">Book a service</text>

  <!-- quick actions -->
  <text x="26" y="398" font-size="13" font-weight="700" fill="#0F172A">Quick booking</text>
  <g>
    <rect x="22" y="412" width="80" height="88" rx="16" fill="#FFFFFF"/>
    <circle cx="62" cy="446" r="17" fill="#FEF3C7"/><text x="62" y="452" font-size="17" text-anchor="middle">🛢️</text>
    <text x="62" y="486" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Oil change</text>
  </g>
  <g>
    <rect x="110" y="412" width="80" height="88" rx="16" fill="#FFFFFF"/>
    <circle cx="150" cy="446" r="17" fill="#DBEAFE"/><text x="150" y="452" font-size="17" text-anchor="middle">🛞</text>
    <text x="150" y="486" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Tyres</text>
  </g>
  <g>
    <rect x="198" y="412" width="80" height="88" rx="16" fill="#FFFFFF"/>
    <circle cx="238" cy="446" r="17" fill="#FEE2E2"/><text x="238" y="452" font-size="17" text-anchor="middle">🛑</text>
    <text x="238" y="486" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Brakes</text>
  </g>
  <g>
    <rect x="286" y="412" width="80" height="88" rx="16" fill="#FFFFFF"/>
    <circle cx="326" cy="446" r="17" fill="#DCFCE7"/><text x="326" y="452" font-size="16" text-anchor="middle">🔧</text>
    <text x="326" y="486" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Diagnostics</text>
  </g>

  <!-- upcoming -->
  <text x="26" y="548" font-size="13" font-weight="700" fill="#0F172A">Upcoming</text>
  <rect x="22" y="562" width="346" height="82" rx="16" fill="#FFFFFF"/>
  <rect x="22" y="562" width="6" height="82" rx="3" fill="#F59E0B"/>
  <text x="44" y="592" font-size="15" font-weight="700" fill="#0F172A">Brake inspection</text>
  <text x="44" y="614" font-size="13" fill="#64748B">Tue 14 Aug · 10:30</text>
  <text x="44" y="632" font-size="12" fill="#94A3B8">PitStop Central — Kruisweg 22</text>
  <rect x="298" y="586" width="54" height="24" rx="12" fill="#DCFCE7"/>
  <text x="325" y="602" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">CONFIRMED</text>

  <!-- promo card -->
  <rect x="22" y="668" width="346" height="72" rx="16" fill="#EEF2FF"/>
  <text x="42" y="700" font-size="14" font-weight="700" fill="#3730A3">Winter check-up — 20% off</text>
  <text x="42" y="720" font-size="12" fill="#6366F1">Battery, tyres &amp; fluids before the cold hits.</text>

  <!-- bottom nav -->
  <rect x="0" y="768" width="390" height="76" fill="#FFFFFF"/>
  <line x1="0" y1="768" x2="390" y2="768" stroke="#E2E8F0"/>
  <g text-anchor="middle">
    <text x="55" y="800" font-size="18">🏠</text><text x="55" y="820" font-size="10" font-weight="700" fill="#F59E0B">Home</text>
    <text x="160" y="800" font-size="18">📅</text><text x="160" y="820" font-size="10" fill="#94A3B8">Bookings</text>
    <text x="250" y="800" font-size="18">📍</text><text x="250" y="820" font-size="10" fill="#94A3B8">Garages</text>
    <text x="340" y="800" font-size="18">👤</text><text x="340" y="820" font-size="10" fill="#94A3B8">Profile</text>
  </g>
</svg>
